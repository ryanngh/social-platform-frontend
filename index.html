<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RySocial · Connect · Share · Be You</title>
    <meta name="description" content="Nơi những khoảnh khắc đẹp được kết nối, lan tỏa và trở nên ý nghĩa hơn. Nền tảng mạng xã hội hiện đại hàng đầu." />

    <!-- OpenGraph / Facebook / Zalo / Telegram / Discord Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rysocial.app/" />
    <meta property="og:title" content="RySocial · Connect · Share · Be You" />
    <meta property="og:description" content="Nơi những khoảnh khắc đẹp được kết nối, lan tỏa và trở nên ý nghĩa hơn." />
    <meta property="og:image" content="https://rysocial.app/rysocial-og-banner.png" />
    <meta property="og:image:secure_url" content="https://rysocial.app/rysocial-og-banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="381" />
    <meta property="og:image:alt" content="RySocial Banner" />
    <meta property="og:site_name" content="RySocial" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://rysocial.app/" />
    <meta name="twitter:title" content="RySocial · Connect · Share · Be You" />
    <meta name="twitter:description" content="Nơi những khoảnh khắc đẹp được kết nối, lan tỏa và trở nên ý nghĩa hơn." />
    <meta name="twitter:image" content="https://rysocial.app/rysocial-og-banner.png" />
  </head>
  <body class="bg-[#FAFAFB] dark:bg-[#000000]">
    <div id="root">
      <!-- Instant Native Brand Splash Loader (Hiển thị ngay lập tức khi tải trang trước khi React nạp xong) -->
      <style>
        @keyframes rypulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.85; } }
        @keyframes ryshimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
      </style>
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAFB;z-index:99999;font-family:Arial,Helvetica,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
          <div style="width:64px;height:64px;background:#ffffff;border-radius:18px;padding:10px;box-shadow:0 4px 14px rgba(0,0,0,0.06);border:1px solid #f1f5f9;display:flex;align-items:center;justify-content:center;">
            <img src="/logo.svg" alt="RySocial" style="width:100%;height:100%;object-fit:contain;animation:rypulse 1.8s ease-in-out infinite;" />
          </div>
          <span style="font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#004AC6;">RySocial</span>
          <div style="width:120px;height:4px;background:#e2e8f0;border-radius:999px;overflow:hidden;position:relative;">
            <div style="width:50%;height:100%;background:linear-gradient(90deg, #004AC6, #0095F6);border-radius:999px;position:absolute;animation:ryshimmer 1.4s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
