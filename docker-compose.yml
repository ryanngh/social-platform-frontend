services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: react-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://host.docker.internal:8080
      - VITE_MINIO_URL=http://host.docker.internal:9000
